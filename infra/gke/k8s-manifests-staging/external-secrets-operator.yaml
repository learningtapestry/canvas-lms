# External Secrets Operator is installed via Helm (its namespace + service
# account are chart-managed and Workload-Identity annotated). This file only
# declares the store and the sync into the app namespace.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: propane-country-501515-c2
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: canvas-gke
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# Pulls the assembled application and RCE secrets into `canvas-secrets`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canvas-secret
  namespace: canvas-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: canvas-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: canvas-secrets-staging

---
# Render the same RCE keys into the file-backed Vault structure Canvas expects.
# Keeping this as a separate Secret avoids exposing a dotted filename through
# envFrom on every Canvas container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canvas-rce-credentials
  namespace: canvas-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: canvas-rce-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        vault_contents.yml: |
          production:
            'app-canvas/data/secrets':
              data:
                canvas_security:
                  encryption_secret: '{{ .RCE_ECOSYSTEM_KEY }}'
                  signing_secret: '{{ .RCE_ECOSYSTEM_SECRET }}'
  dataFrom:
    - extract:
        key: canvas-secrets-staging
