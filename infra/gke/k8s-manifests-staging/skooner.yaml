# Skooner (Kubernetes dashboard) — canvas-gke staging.
#
#   - Dedicated `skooner` namespace (GKE Autopilot blocks writes to kube-system).
#   - nginx ingress on `skooner.nbdmath.org` (GoDaddy A record -> the LB IP) with
#     a real Let's Encrypt cert issued by cert-manager (secret `skooner-tls`).
#
# Access uses a short-lived skooner-sa token (see the "Generate Skooner token"
# workflow) and is locked to source IPs via the "Update Skooner Ingress IP
# Whitelist" workflow (runtime-managed; not pinned in this manifest).
apiVersion: v1
kind: Namespace
metadata:
  name: skooner

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skooner-sa
  namespace: skooner

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skooner-sa
subjects:
  - kind: ServiceAccount
    name: skooner-sa
    namespace: skooner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skooner
  namespace: skooner
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: skooner
  template:
    metadata:
      labels:
        k8s-app: skooner
    spec:
      serviceAccountName: skooner-sa
      containers:
        - name: skooner
          image: ghcr.io/skooner-k8s/skooner:stable
          ports:
            - containerPort: 4654
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 4654
            initialDelaySeconds: 30
            timeoutSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      nodeSelector:
        'kubernetes.io/os': linux

---
apiVersion: v1
kind: Service
metadata:
  name: skooner
  namespace: skooner
spec:
  ports:
    - port: 80
      targetPort: 4654
  selector:
    k8s-app: skooner

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skooner-ingress
  namespace: skooner
  annotations:
    # Real Let's Encrypt cert via cert-manager (ingress-shim issues skooner-tls).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # NOTE: do NOT set force-ssl-redirect — it 308-redirects the ACME HTTP-01
    # challenge and breaks issuance/renewal. A tls block already gives HTTP->HTTPS.
    # Access lock-down (whitelist-source-range) is managed at runtime by the
    # "Update Skooner Ingress IP Whitelist" workflow — intentionally not set here
    # so `kubectl apply` doesn't reset the live allow-list.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - skooner.nbdmath.org
      secretName: skooner-tls
  rules:
    - host: skooner.nbdmath.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skooner
                port:
                  number: 80
